# Source: hpe-csi-driver/templates/alletramp-block-csp.yaml
### Alletra Storage MP B10000 Block CSP Service (WSAPI v3 native) ###
kind: Service
apiVersion: v1
metadata:
  name: alletrastoragemp-block-csp-svc
  namespace: hpe-storage
  labels:
    app: alletrastoragemp-block-csp-svc
spec:
  ports:
  - port: 8080
    protocol: TCP
  selector:
    app: alletrastoragemp-block-csp
---
# Source: hpe-csi-driver/templates/alletramp-block-csp.yaml
### CSP deployment ###
kind: Deployment
apiVersion: apps/v1
metadata:
  name: alletrastoragemp-block-csp
  labels:
    app: alletrastoragemp-block-csp
  namespace: hpe-storage
spec:
  selector:
    matchLabels:
      app: alletrastoragemp-block-csp
  replicas: 1
  template:
    metadata:
      labels:
        app: alletrastoragemp-block-csp
    spec:
      serviceAccountName: hpe-csp-sa
      priorityClassName: system-cluster-critical
      containers:
        - name: alletrastoragemp-block-csp
          image: "quay.io/skalikiva/hpestorage/alletrastoragemp-b10000-block-csp:edge"
          resources:
            limits:
              cpu: 2000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          imagePullPolicy: "IfNotPresent"
          env:
            - name: HPE_CSP_LOG_LEVEL
              value: info
            # GOMEMLIMIT set to ~83% of the csp.resources memory limit (1Gi default) so the Go GC
            # runs before the container hits its hard limit, matching primera3par-csp (ESC-17696).
            - name: GOMEMLIMIT
              value: "850MiB"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: log-dir
              mountPath: /var/log
      volumes:
        - name: log-dir
          hostPath:
            path: /var/log
