{{- if not .Values.disable.alletraStorageMPBlock }}

---
### Alletra Storage MP B10000 Block CSP Service (WSAPI v3 native) ###
kind: Service
apiVersion: v1
metadata:
  name: alletrastoragemp-block-csp-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: alletrastoragemp-block-csp-svc
spec:
  ports:
  - port: 8080
    protocol: TCP
  selector:
    app: alletrastoragemp-block-csp

---
### CSP deployment ###
kind: Deployment
apiVersion: apps/v1
metadata:
  name: alletrastoragemp-block-csp
  labels:
    app: alletrastoragemp-block-csp
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: alletrastoragemp-block-csp
  replicas: 1
  template:
    metadata:
      labels:
        app: alletrastoragemp-block-csp
        {{- if .Values.csp.labels }}
{{ toYaml .Values.csp.labels | indent 8 }}
        {{- end }}
    spec:
      serviceAccountName: hpe-csp-sa
      priorityClassName: system-cluster-critical
      containers:
        - name: alletrastoragemp-block-csp
          image: {{ .Values.images.alletraMPBlockCSP | quote }}
          resources:
            {{- toYaml .Values.csp.resources | nindent 12 }}
          imagePullPolicy: {{ .Values.imagePullPolicy | quote }}
          env:
            - name: HPE_CSP_LOG_LEVEL
              value: {{ .Values.logLevel }}
            # GOMEMLIMIT set to ~83% of the csp.resources memory limit (1Gi default) so the Go GC
            # runs before the container hits its hard limit, matching primera3par-csp (ESC-17696).
            - name: GOMEMLIMIT
              value: "850MiB"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: log-dir
              mountPath: /var/log
      volumes:
        - name: log-dir
          hostPath:
            path: /var/log
      {{- if .Values.csp.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.csp.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.csp.tolerations }}
      tolerations:
{{ toYaml .Values.csp.tolerations | indent 8 }}
      {{- end }}
      {{- if .Values.csp.affinity }}
      affinity:
{{ toYaml .Values.csp.affinity | indent 8 }}
      {{- end }}
{{- end }}
